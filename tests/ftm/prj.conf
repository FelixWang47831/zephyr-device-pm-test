#
# Layer-independent configuration only. The PM symbols come from the layer, which
# comes from the pm-* snippet; see lib/pm_test/Kconfig and docs/pm-layers.md.

CONFIG_ZTEST=y
CONFIG_PM_TEST=y

CONFIG_PWM=y

# The 1024-byte ztest and main stack defaults are not enough for this case on a
# Cortex-M0+ with picolibc: the TC_PRINT in ftm_report_hw formats six arguments,
# and the overflow surfaces as a spurious assertion failure whose own report then
# panics inside zassert_vprint with k_current_get called pre-kernel. Observed on
# frdm_ke17z.
CONFIG_ZTEST_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# Driver logging at info level, immediate: the run ends with interrupts locked so
# that the core cannot park in WFI, and a deferred log would never be flushed.
# include/pm_test/layer.h asserts this pairing.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PWM_LOG_LEVEL_INF=y
