#
# One scenario per layer, and the layer is named once, as a snippet.
#
# Five layers, not six. No SoC with an FTM declares a suspend-to-ram power state,
# so pm-dpd cannot be configured at all -- its overlay enables &deeppowerdown,
# which is not a label that exists here. docs/pm-layers.md still defines six; this
# case covers the five that the silicon can reach. What dpd would have proved is
# carried by sysmanaged instead: this driver gates its clock from SUSPEND, so the
# register image is gone after every suspend and the resume has to rebuild it.

common:
  tags:
    - pm
    - pwm
    - drivers
  harness: ztest
  platform_allow:
    - frdm_ke17z
    - frdm_mcxe247

tests:
  # The control. No snippet, so the lib/pm_test layer choice falls back to baseline.
  drivers.pm.ftm.baseline: {}

  drivers.pm.ftm.device:
    required_snippets:
      - pm-device

  drivers.pm.ftm.runtime:
    required_snippets:
      - pm-runtime

  drivers.pm.ftm.system:
    required_snippets:
      - pm-system

  # Both targets. frdm_ke17z chooses zephyr,system-timer-companion = &lptmr0 in
  # its board devicetree; frdm_mcxe247 gets the same from boards/, because MCXE24x
  # leaves its lptmr0 disabled and unmarked. Without a companion counter the
  # forced Deep Sleep has nothing to end it.
  #
  # frdm_mcxe247 returns in 2.03 s, but needs boards/frdm_mcxe247.conf to survive
  # the sweep at all, see mcxe247-idle-stack-too-small-for-pm-sweep.
  drivers.pm.ftm.sysmanaged:
    required_snippets:
      - pm-sysmanaged
